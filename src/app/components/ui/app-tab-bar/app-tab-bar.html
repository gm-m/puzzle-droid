@if (shell.tabBarVisible()) {
  <nav class="tabbar" aria-label="Navigazione principale">
    <a class="tab" [attr.aria-current]="currentPage('library')" routerLink="/library" (click)="onTabTap()">
      <app-icon name="books"></app-icon>
      <span>Libreria</span>
    </a>
    <a class="tab" [attr.aria-current]="currentPage('analysis')" routerLink="/analysis" (click)="onTabTap()">
      <app-icon name="board"></app-icon>
      <span>Analisi</span>
    </a>
    <a class="tab" [attr.aria-current]="currentPage('rush')" routerLink="/rush" (click)="onTabTap()">
      <app-icon name="bolt"></app-icon>
      <span>Rush</span>
    </a>
    <a class="tab" [attr.aria-current]="currentPage('woodpecker-dashboard')" [routerLink]="woodpeckerLink()" (click)="onTabTap()">
      <app-icon name="chart"></app-icon>
      <span>Woodpecker</span>
    </a>
    <a class="tab" [attr.aria-current]="currentPage('settings')" routerLink="/settings" (click)="onTabTap()">
      <app-icon name="settings"></app-icon>
      <span>Impostazioni</span>
    </a>
  </nav>
}
